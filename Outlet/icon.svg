<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Win95/98-style pixel icon: a window holding a note page -->
  <defs>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1070b8"/>
    </linearGradient>
  </defs>
  <!-- window: black outline, grey body, 3D bevel -->
  <rect x="1" y="2" width="30" height="28" fill="#000"/>
  <rect x="2" y="3" width="28" height="26" fill="#c0c0c0"/>
  <rect x="2" y="3" width="27" height="1" fill="#fff"/>
  <rect x="2" y="3" width="1" height="25" fill="#fff"/>
  <rect x="3" y="28" width="27" height="1" fill="#808080"/>
  <rect x="29" y="4" width="1" height="25" fill="#808080"/>
  <!-- title bar: title text and close button -->
  <rect x="4" y="5" width="24" height="5" fill="url(#title)"/>
  <rect x="6" y="7" width="10" height="1" fill="#fff"/>
  <rect x="23" y="6" width="3" height="3" fill="#c0c0c0"/>
  <!-- sunken note page with lines of text -->
  <rect x="4" y="11" width="24" height="15" fill="#808080"/>
  <rect x="5" y="12" width="23" height="14" fill="#fff"/>
  <rect x="7" y="14" width="17" height="1" fill="#000080"/>
  <rect x="7" y="17" width="14" height="1" fill="#000080"/>
  <rect x="7" y="20" width="18" height="1" fill="#000080"/>
  <rect x="7" y="23" width="10" height="1" fill="#000"/>
</svg>
