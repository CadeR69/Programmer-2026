<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Solanki Atelier</title>
    <meta
      name="description"
      content="A considered luxury salon experience for hair, skin, beauty and bridal rituals."
    />
    <meta name="robots" content="max-image-preview:large" />

    <!-- TODO: point this at your own domain before launch.
         It was copied from the Framer preview site, which tells search
         engines the "real" version of this page lives somewhere else.
    <link rel="canonical" href="https://your-domain.com/" />
    -->

    <!-- Icons - TODO: replace with a Solanki Atelier favicon.
         These are Framer's generic defaults. -->
    <link
      rel="icon"
      href="https://framerusercontent.com/sites/icons/default-favicon-light.v1.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="https://framerusercontent.com/sites/icons/default-favicon-dark.v1.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      href="https://framerusercontent.com/sites/icons/default-touch-icon.v3.png"
    />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Solanki Atelier" />
    <meta
      property="og:description"
      content="A considered luxury salon experience for hair, skin, beauty and bridal rituals."
    />
    <!-- TODO: add both of these before launch, or link previews render blank.
         og:url must match the canonical URL above.
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/social-preview.jpg" />
    -->

    <!-- X / Twitter link previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solanki Atelier" />
    <meta
      name="twitter:description"
      content="A considered luxury salon experience for hair, skin, beauty and bridal rituals."
    />
    <!-- TODO: summary_large_image above promises an image. Without this the
         card falls back to a plain link.
    <meta name="twitter:image" content="https://your-domain.com/social-preview.jpg" />
    -->

    <!-- Fonts: only the weights stylesheet-1.css actually uses.
         Add more to the URL when you use more. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;600&display=swap"
    />

    <link rel="stylesheet" href="stylesheet-1.css" />
  </head>

  <body>
    <!-- TODO: the page has no content yet. Header, hero, services,
         about, gallery and footer all still need to be written. -->

    <script src="scripts.js" defer></script>
  </body>
</html>
