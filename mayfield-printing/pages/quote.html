<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Quote | Mayfield Printing</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>
    <header>
        <h1>Mayfield Printing</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="gallery.html">Print Examples</a></li>
                <li><a href="quote.html">Request a Quote</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Request a Quote</h2>

            <p>
                Tell us about your project and we will get back to you with pricing and turnaround time.
            </p>

            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="service">Service Needed</label>
                    <select id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="business-essentials">Business Essentials (cards, letterhead, envelopes)</option>
                        <option value="marketing-materials">Marketing Materials (brochures, flyers, newsletters)</option>
                        <option value="forms-labels">Forms & Labels</option>
                        <option value="bound-materials">Bound Materials (books, catalogs, magazines)</option>
                        <option value="other">Other / Custom Project</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Estimated Quantity</label>
                    <input type="text" id="quantity" name="quantity" placeholder="e.g. 500 business cards">
                </div>

                <div class="form-group">
                    <label for="details">Project Details</label>
                    <textarea id="details" name="details" placeholder="Tell us more about your project, timeline, and any specifications." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mayfield Printing. All rights reserved.</p>
    </footer>
</body>
</html>
